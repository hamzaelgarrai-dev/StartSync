name: Production Checks

on:
  pull_request:
    branches:
      - production

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup PHP on the Runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Match your local version
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath
          tools: composer

      # 2. Install Dependencies on Runner (Ensures artisan works immediately)
      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist

      # 3. Prepare .env BEFORE Docker starts
      - name: Prepare environment
        run: |
          cp ./backend/.env.example ./backend/.env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=mysql/g' ./backend/.env
          sed -i 's/DB_DATABASE=laravel/DB_DATABASE=StartSync_DB/g' ./backend/.env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=root/g' ./backend/.env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=/g' ./backend/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Docker
        run: docker compose up -d --build

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to accept connections..."
          timeout 60 bash -c 'until docker compose exec -T mysql mysql -u root -e "SELECT 1" >/dev/null 2>&1; do echo "MySQL is still starting..."; sleep 3; done'
          echo "MySQL is ready!"

      # 4. Finalize Laravel Setup inside container
      - name: Setup Laravel
        run: |
          docker compose exec -T laravel sh -c '
            php artisan key:generate --force &&
            php artisan migrate --force
          '

      # 5. Run Tests
      - name: Run Laravel Tests
        run: docker compose exec -T laravel php artisan test

      # 6. Build React (Note: npm ci is faster for CI)
      - name: Build React
        run: |
          docker compose exec -T react sh -c '
            npm ci &&
            npm run build
          '

      # Show logs on failure
      - name: Show logs
        if: failure()
        run: docker compose logs

      # Cleanup
      - name: Cleanup
        if: always()
        run: docker compose down -v